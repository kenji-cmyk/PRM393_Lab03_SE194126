name: vetalife
description: VetaLife - Meal journaling and book-grounded nutrition learning.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: 6.1.5+1
  firebase_core: 4.15.0
  firebase_auth: 6.7.0
  cloud_firestore: 6.10.0
  google_sign_in: 7.2.0
  shared_preferences: 2.5.6
  flutter_svg: 2.3.2
  image_picker: 1.2.4
  firebase_ai: 4.0.0
  firebase_app_check: 0.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/content/meal-knowledge.json
    - assets/content/lesson-catalog.json
    - assets/content/lesson-content.json
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
